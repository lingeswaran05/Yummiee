<style>

            box-shadow: 0 0 0 4px rgba(174, 49, 21, 0.1);
        }
        .toast-enter {
            animation: slideUp 0.3s ease-out forwards;
        }

<body class="bg-surface text-on-surface antialiased min-h-screen flex selection:bg-primary selection:text-on-primary">
<main class="flex-1 flex flex-col md:flex-row w-full max-w-container-max mx-auto h-screen relative">
<div class="w-full md:w-1/2 flex flex-col justify-center px-margin-mobile md:px-margin-desktop py-12 md:py-0 relative z-10 bg-surface md:bg-transparent">
<div class="mb-8 md:mb-12">
<div class="flex items-center gap-2 mb-8">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">restaurant</span>
<span class="font-headline-sm text-headline-sm text-primary font-bold">CookSync</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg mb-4 text-on-background">Create your CookSync account</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Start organizing your recipes and shopping smarter.</p>
</div>
<form class="flex flex-col gap-6 max-w-[440px] w-full" id="registrationForm">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<div class="relative input-glow rounded-xl">
<input class="w-full h-[56px] px-4 py-4 rounded-xl border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors pl-12" id="fullName" placeholder="e.g. Jane Doe" type="text" value="Alex Johnson">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative input-glow rounded-xl">
<input class="w-full h-[56px] px-4 py-4 rounded-xl border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors pl-12" id="email" placeholder="you@example.com" type="email" value="alex@example.com">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative input-glow rounded-xl">
<input class="w-full h-[56px] px-4 py-4 rounded-xl border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors pl-12 pr-12" id="password" placeholder="••••••••" type="password" value="S3cr3tP@ssw0rd!">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="confirmPassword">Confirm Password</label>
<div class="relative input-glow rounded-xl">
<input class="w-full h-[56px] px-4 py-4 rounded-xl border-2 border-error bg-error-container/20 font-body-md text-body-md text-on-surface focus:outline-none focus:border-error focus:ring-0 transition-colors pl-12" id="confirmPassword" placeholder="••••••••" type="password">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-error">lock</span>
</div>
<span class="font-body-sm text-body-sm text-error flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-[16px]">error</span>
                        Passwords do not match.
                    </span>
</div>
<button class="w-full h-[56px] bg-primary hover:bg-on-primary-fixed-variant text-on-primary rounded-xl font-label-md text-label-md transition-colors duration-200 flex items-center justify-center gap-2 shadow-[0_4px_12px_rgba(174,49,21,0.2)] mt-6" onclick="showToast()" type="button">
                    Create Account
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="font-body-md text-body-md text-center text-on-surface-variant mt-6">
                    Already have an account? <a class="text-primary hover:underline font-bold" href="#">Login</a>
</p>
</form>
</div>
<div class="hidden md:block w-1/2 h-full relative overflow-hidden bg-surface-container">
<div class="absolute inset-0 bg-cover bg-center bg-no-repeat w-full h-full" data-alt="A breathtaking, professional food photography shot of a modern, bright kitchen counter. High-key natural light pours in from a nearby window, illuminating fresh, vibrant ingredients—bright red tomatoes, crisp green basil, and golden olive oil. The scene uses a soft minimalist aesthetic with a light mode color palette of pristine whites, soft creams, and striking culinary accents. The mood is fresh, premium, and deeply inspiring for cooking." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDLDBdYA5aJ9lBVztc3sFbylbUMjrlyc8mZqWNejJRtnqIKVJ9GNG32EBRsCe1xqfFYD7Pb-xS0KXgg7_sqmMcH38M4jdxPcRC4wVhrtJ_6AF23KIxl9lhoKJQr0sZRzLhg9ORWf6x6yVYqRouE7BiZZtPABawO8UrMoCdTe8b9lvvXkoK08DhzxERRey8Ls2jL4G5u6j6qiltgPVs1mZgxldO27WbDA5Ngv_i-JbsK1l_7yvQEICb0')"></div>
<div class="absolute inset-0 bg-gradient-to-r from-surface via-surface/40 to-transparent"></div>
</div>
</main>
<div class="fixed bottom-margin-mobile md:bottom-margin-desktop left-1/2 -translate-x-1/2 flex items-center gap-4 bg-surface-container-lowest border border-outline-variant shadow-[0_12px_24px_rgba(0,0,0,0.08)] rounded-xl p-4 z-50 hidden toast-enter" id="successToast">
<div class="w-10 h-10 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div>
<h4 class="font-headline-sm text-headline-sm text-on-surface mb-1">Account Created</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant">Welcome to CookSync! Redirecting to your dashboard...</p>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors ml-4 shrink-0 p-2" onclick="hideToast()">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<script>
        function showToast() {
            const toast = document.getElementById('successToast');
            toast.classList.remove('hidden');
            setTimeout(() => hideToast(), 5000);
        }

        function hideToast() {
            const toast = document.getElementById('successToast');
            toast.classList.add('hidden');
        }
    </script>
