<script>
        const totalItems = 9; // Based on the HTML items added (5 veg, 2 grains, 2 dairy, 2 spices)

        function updateProgress(checkbox) {
            const row = checkbox.closest('.item-row');
            if (checkbox.checked) {
                row.classList.add('checked');
            } else {
                row.classList.remove('checked');
            }
            calculateProgress();
        }

        function calculateProgress() {
            const checkedBoxes = document.querySelectorAll('.custom-checkbox:checked').length;
            
            // Update counter text
            const counterText = document.querySelector('header .text-primary.font-bold');
            if(counterText) {
                counterText.textContent = checkedBoxes;
            }
        }

        function markAll() {
            const checkboxes = document.querySelectorAll('.custom-checkbox');
            checkboxes.forEach(box => {
                box.checked = true;
                box.closest('.item-row').classList.add('checked');
            });
            calculateProgress();
        }
    </script>
