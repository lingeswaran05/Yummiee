server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve built assets when they exist.  Every other URL is a React route,
    # so send it to the app instead of returning Nginx's 404 page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
