services:
  - type: web
    name: yummiee-backend
    env: docker
    dockerContext: backend-java
    dockerfilePath: backend-java/Dockerfile
    rootDir: backend-java
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: YUMMIEE_DB_PATH
        value: /var/data/yummiee.db
      - key: YUMMIEE_FRONTEND_URL
        sync: false
    disk:
      name: yummiee-data
      mountPath: /var/data
      sizeGB: 1

  - type: static
    name: yummiee-frontend
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: Frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
