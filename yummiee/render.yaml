services:
  - type: web
    name: yummiee-backend
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    rootDir: backend-java
    plan: free
    healthCheckPath: /api/health

    envVars:
      - key: PORT
        value: 8080

      - key: YUMMIEE_DB_PATH
        value: ./data/yummiee.db

      - key: YUMMIEE_FRONTEND_URL
        sync: false

  - type: web
    runtime: static
    name: yummiee-frontend
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        sync: false

      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
